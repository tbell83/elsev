name: Site Check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_SITE_CHECK_ROLE_ARN }}
          aws-region: us-east-1
      # Hosts and tasks can still be starting, so retry for about 5 minutes.
      - run: |
          instance_id=$(aws ec2 describe-instances \
            --filters Name=tag:Name,Values=elsev-bastion Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          for attempt in {1..20}; do
            command_id=$(aws ssm send-command --instance-ids "$instance_id" \
              --document-name elsev-site-check --query 'Command.CommandId' --output text)
            if aws ssm wait command-executed --command-id "$command_id" --instance-id "$instance_id"; then
              echo "Site returned HTTP 200 on attempt $attempt"
              exit 0
            fi
            aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance_id" \
              --query 'StandardOutputContent' --output text
            sleep 15
          done
          echo "::error::Site did not return HTTP 200"
          exit 1
